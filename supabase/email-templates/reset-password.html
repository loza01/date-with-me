<!-- Supabase → Authentication → Emails → Templates → "Reset password" -->
<!-- Subject: Reset your password · The Chosen Path -->
<div style="margin:0;padding:32px 16px;background:#fbf5ee;font-family:Helvetica,Arial,sans-serif;color:#242120">
  <div style="max-width:480px;margin:0 auto;background:#fffcf8;border:1px solid #e8d7c5;border-radius:20px;padding:36px 32px">
    <p style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:.5px">The Chosen Path</p>
    <h1 style="margin:0 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:normal">Reset your password</h1>
    <p style="margin:0 0 28px;line-height:1.6;color:#5c5753">
      We received a request to reset the password for {{ .Email }}. This link works once and expires soon.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:#a33a4e;color:#fffcf8;text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:600">
      Choose a new password
    </a>
    <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#7a7470">
      If you didn’t ask for this, ignore this email; your password stays the same.<br />
      Questions? <a href="mailto:support@doomfast.com" style="color:#a33a4e">support@doomfast.com</a>
    </p>
  </div>
</div>
